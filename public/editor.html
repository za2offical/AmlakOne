<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاربران</title>
    <link rel="icon" type="image/jpeg" href="/AmlakOne-logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #181c24;
            --panel: #232837;
            --accent: #4f8cff;
            --accent-hover: #2563eb;
            --text: #f3f4f6;
            --text-light: #b0b3b8;
            --danger: #ff4f4f;
            --border: #2c3142;
            --radius: 14px;
            --shadow: 0 4px 24px 0 rgba(0,0,0,0.18);
            --success: #10b981;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 32px;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .panel {
            background: var(--panel);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 28px 24px 28px;
            margin: 32px 0 0 0;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        .panel h2 {
            margin: 0 0 18px 0;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        label {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        input[type="text"], input[type="password"], textarea {
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 10px 12px;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
            font-family: inherit;
        }
        input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
            border-color: var(--accent);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button, .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 0;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px 0 rgba(79,140,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover, .btn:hover {
            background: var(--accent-hover);
        }
        .user-list, .notification-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .user-item, .notification-item {
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: border 0.2s;
        }
        .user-item:hover, .notification-item:hover {
            border-color: var(--accent);
        }
        .user-info, .notification-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }
        .username {
            font-weight: 700;
            font-size: 1.08rem;
        }
        .notification-title {
            font-weight: 700;
            font-size: 1.08rem;
            color: var(--accent);
        }
        .notification-message {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-top: 4px;
            line-height: 1.4;
        }
        .notification-meta {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-top: 6px;
        }
        .change-btn {
            background: var(--panel);
            color: var(--accent);
            border: 1.5px solid var(--accent);
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .change-btn:hover {
            background: var(--accent);
            color: #fff;
        }
        .change-btn svg {
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }
        .delete-btn {
            background: var(--panel);
            color: var(--danger);
            border: 1.5px solid var(--danger);
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .delete-btn:hover {
            background: var(--danger);
            color: #fff;
        }
        .logout-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 0;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
        .centered {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
        }
        #admin-login-panel.centered {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: none;
        }
        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
        .error-message {
            background: rgba(255, 79, 79, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .tab {
            background: var(--bg);
            color: var(--text-light);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        @media (max-width: 600px) {
            .panel {
                padding: 18px 6px 14px 6px;
                max-width: 98vw;
            }
        }
        .admin-login-modern {
            background: rgba(35, 40, 55, 0.98);
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
            border: 1.5px solid #2c3142;
            padding: 44px 38px 32px 38px;
            min-width: 0;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.7s cubic-bezier(.39,.575,.565,1.000);
        }
        .admin-login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 18px;
        }
        .admin-login-icon {
            margin-bottom: 6px;
        }
        .admin-login-title {
            color: #4f8cff;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .admin-login-error {
            color: #ff4f4f;
            background: rgba(255,79,79,0.09);
            border-radius: 7px;
            padding: 7px 12px;
            margin-bottom: 10px;
            font-size: 0.98rem;
            text-align: center;
            display: none;
        }
        .admin-login-modern form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 13px;
        }
        .admin-login-input-group {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }
        .admin-login-input-group input {
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            display: block;
            background: #232837;
            border: 1.5px solid #2c3142;
            border-radius: 10px;
            color: #f3f4f6;
            padding: 10px 36px 10px 10px;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        .admin-login-input-group input:focus {
            border-color: #4f8cff;
        }
        .admin-login-input-group input::placeholder {
            color: #8a8d94;
            font-size: 0.97rem;
        }
        .admin-login-input-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .admin-login-btn {
            background: linear-gradient(90deg, #4f8cff 60%, #2563eb 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 0;
            font-size: 1.08rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 12px 0 rgba(79,140,255,0.13);
            transition: background 0.2s, transform 0.15s;
            margin-top: 6px;
        }
        .admin-login-btn:hover {
            background: linear-gradient(90deg, #2563eb 0%, #4f8cff 100%);
            transform: translateY(-2px) scale(1.03);
        }
        @media (max-width: 600px) {
            .admin-login-modern {
                max-width: 98vw;
                padding: 18px 2vw 14px 2vw;
            }
            .admin-login-input-group input {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1 id="main-title" style="display:none;">پنل مدیریت کاربران</h1>
    <div id="admin-login-panel" class="centered" style="display:none;">
        <div class="admin-login-modern">
            <div class="admin-login-header">
                <span class="admin-login-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="8" rx="3" stroke="#4f8cff" stroke-width="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3" stroke="#4f8cff" stroke-width="2"/></svg>
                </span>
                <span class="admin-login-title">ورود ادمین</span>
            </div>
            <div class="admin-login-error" id="adminLoginError"></div>
            <form id="adminLoginForm">
                <div class="admin-login-input-group">
                    <input type="text" id="admin-username" required autocomplete="off" placeholder="نام کاربری ادمین">
                    <span class="admin-login-input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#8a8d94" stroke-width="2"/><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#8a8d94"/></svg>
                    </span>
                </div>
                <div class="admin-login-input-group">
                    <input type="password" id="admin-password" required autocomplete="off" placeholder="رمز عبور ادمین">
                    <span class="admin-login-input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="8" rx="3" stroke="#8a8d94" stroke-width="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3" stroke="#8a8d94" stroke-width="2"/></svg>
                    </span>
                </div>
                <button type="submit" class="admin-login-btn">ورود</button>
            </form>
        </div>
    </div>
    <div id="admin-panel" class="panel" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h2>پنل مدیریت</h2>
            <button class="logout-btn" id="logoutBtn">خروج</button>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('users')">کاربران</div>
            <div class="tab" onclick="switchTab('notifications')">اعلان‌ها</div>
            <div class="tab" onclick="switchTab('tickets')">تیکت‌ها</div>
        </div>

        <!-- Tab Content for Users -->
        <div id="users-tab" class="tab-content active">
            <div>
                <h2>ایجاد کاربر جدید</h2>
                <form id="userForm">
                    <div>
                        <label for="username">نام کاربری</label>
                        <input type="text" id="username" required autocomplete="off">
                    </div>
                    <div>
                        <label for="password">رمز عبور</label>
                        <input type="password" id="password" required autocomplete="off">
                    </div>
                    <button type="submit">ایجاد کاربر</button>
                </form>
            </div>
            <div>
                <h2>لیست کاربران</h2>
                <ul id="users" class="user-list"></ul>
            </div>
        </div>

        <!-- Tab Content for Notifications -->
        <div id="notifications-tab" class="tab-content">
            <div>
                <h2>ارسال اعلان جدید</h2>
                <div class="success-message" id="notificationSuccess"></div>
                <div class="error-message" id="notificationError"></div>
                <form id="notificationForm">
                    <div>
                        <label for="notificationTitle">عنوان اعلان</label>
                        <input type="text" id="notificationTitle" required autocomplete="off" maxlength="100" placeholder="عنوان اعلان را وارد کنید">
                    </div>
                    <div>
                        <label for="notificationMessage">متن اعلان</label>
                        <textarea id="notificationMessage" required autocomplete="off" maxlength="1000" placeholder="متن اعلان را وارد کنید"></textarea>
                    </div>
                    <button type="submit">ارسال اعلان</button>
                </form>
            </div>
            <div>
                <h2>اعلان‌های ارسال شده</h2>
                <ul id="notifications" class="notification-list"></ul>
            </div>
        </div>

        <!-- Tab Content for Tickets -->
        <div id="tickets-tab" class="tab-content">
            <div style="text-align: center; padding: 40px 20px;">
                <h2>مدیریت تیکت‌ها</h2>
                <p style="color: var(--text-light); margin-bottom: 30px;">برای مدیریت کامل تیکت‌ها، از پنل اختصاصی استفاده کنید</p>
                <button class="btn" onclick="window.location.href='/admin-tickets'" style="background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-left: 8px;">
                        <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
                    </svg>
                    ورود به پنل مدیریت تیکت‌ها
                </button>
            </div>
        </div>
    </div>
    <script>
        // Helper: check admin auth
        async function checkAdminAuth() {
            const res = await fetch('/api/editor/users', { credentials: 'include' });
            return res.status !== 401;
        }

        // Show/hide panels
        function showAdminPanel() {
            document.getElementById('admin-login-panel').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'flex';
            document.getElementById('main-title').style.display = 'block';
        }
        function showLoginPanel() {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('admin-login-panel').style.display = 'flex';
            document.getElementById('main-title').style.display = 'none';
        }

        // Tab switching
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');

            // Load content based on tab
            if (tabName === 'users') {
                loadUsers();
            } else if (tabName === 'notifications') {
                loadNotifications();
            } else if (tabName === 'tickets') {
                // Load tickets content
            }
        }

        // Admin login logic
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;
            const errorMsg = document.getElementById('adminLoginError');
            errorMsg.style.display = 'none';
            try {
                const response = await fetch('/api/login/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok && data.isAdmin) {
                    showAdminPanel();
                    loadUsers();
                } else {
                    errorMsg.textContent = data.error || 'ورود ناموفق بود';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'خطا در ورود ادمین';
                errorMsg.style.display = 'block';
            }
        });

        // Logout logic
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/login/logout', { method: 'POST', credentials: 'include' });
            showLoginPanel();
        });

        // Load users on page load
        async function loadUsers() {
            try {
                const response = await fetch('/api/editor/users', { credentials: 'include' });
                if (response.status === 401) {
                    showLoginPanel();
                    return;
                }
                const users = await response.json();
                const usersList = document.getElementById('users');
                usersList.innerHTML = '';
                users.forEach(user => {
                    const li = document.createElement('li');
                    li.className = 'user-item';
                    const info = document.createElement('div');
                    info.className = 'user-info';
                    const username = document.createElement('span');
                    username.className = 'username';
                    username.textContent = user.username;
                    info.appendChild(username);
                    li.appendChild(info);
                    // دکمه تغییر رمز
                    const changeBtn = document.createElement('button');
                    changeBtn.className = 'change-btn';
                    changeBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 15V12M12 12V9M12 12H15M12 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/></svg> تغییر رمز`;
                    changeBtn.onclick = async () => {
                        const newPassword = prompt('رمز جدید را وارد کنید (حداقل 8 کاراکتر، حروف بزرگ و کوچک، عدد و کاراکتر خاص):');
                        if (!newPassword) return;
                        try {
                            const response = await fetch('/api/editor/change-password', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                credentials: 'include',
                                body: JSON.stringify({ username: user.username, newPassword })
                            });
                            const data = await response.json();
                            if (response.ok) {
                                alert('رمز با موفقیت تغییر کرد');
                            } else {
                                alert(data.error || 'خطا در تغییر رمز');
                            }
                        } catch (err) {
                            alert('خطا در تغییر رمز');
                        }
                    };
                    li.appendChild(changeBtn);
                    // دکمه رفع محدودیت لاگین
                    const unlockBtn = document.createElement('button');
                    unlockBtn.className = 'change-btn';
                    unlockBtn.style.background = '#232837';
                    unlockBtn.style.color = '#ffb300';
                    unlockBtn.style.borderColor = '#ffb300';
                    unlockBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M12 17v-4m0 0V9m0 4h4m-4 0H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="9" stroke="currentColor" stroke-width="2"/></svg> رفع محدودیت لاگین`;
                    unlockBtn.onclick = async () => {
                        if (!confirm('آیا مطمئن هستید که می‌خواهید محدودیت لاگین این کاربر را رفع کنید؟')) return;
                        try {
                            const response = await fetch('/api/editor/unlock-user', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                credentials: 'include',
                                body: JSON.stringify({ username: user.username })
                            });
                            const data = await response.json();
                            if (response.ok) {
                                alert('محدودیت لاگین کاربر رفع شد');
                            } else {
                                alert(data.error || 'خطا در رفع محدودیت');
                            }
                        } catch (err) {
                            alert('خطا در رفع محدودیت');
                        }
                    };
                    li.appendChild(unlockBtn);
                    usersList.appendChild(li);
                });
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Load notifications
        async function loadNotifications() {
            try {
                const response = await fetch('/api/editor/notifications', { credentials: 'include' });
                if (response.status === 401) {
                    showLoginPanel();
                    return;
                }
                const notifications = await response.json();
                const notificationsList = document.getElementById('notifications');
                notificationsList.innerHTML = '';

                if (notifications.length === 0) {
                    notificationsList.innerHTML = '<li style="text-align: center; color: var(--text-light); padding: 20px;">هیچ اعلانی ارسال نشده است</li>';
                    return;
                }

                notifications.forEach(notification => {
                    const li = document.createElement('li');
                    li.className = 'notification-item';

                    const info = document.createElement('div');
                    info.className = 'notification-info';

                    const title = document.createElement('div');
                    title.className = 'notification-title';
                    title.textContent = notification.title;

                    const message = document.createElement('div');
                    message.className = 'notification-message';
                    message.textContent = notification.message;

                    const meta = document.createElement('div');
                    meta.className = 'notification-meta';
                    const sentDate = new Date(notification.sentAt).toLocaleString('fa-IR');
                    meta.textContent = `ارسال شده در ${sentDate} توسط ${notification.sentBy}`;

                    info.appendChild(title);
                    info.appendChild(message);
                    info.appendChild(meta);
                    li.appendChild(info);

                    // دکمه حذف
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> حذف`;
                    deleteBtn.onclick = async () => {
                        if (!confirm('آیا مطمئن هستید که می‌خواهید این اعلان را حذف کنید؟')) return;
                        try {
                            const response = await fetch(`/api/editor/notifications/${notification.id}`, {
                                method: 'DELETE',
                                credentials: 'include'
                            });
                            const data = await response.json();
                            if (response.ok) {
                                alert('اعلان با موفقیت حذف شد');
                                loadNotifications();
                            } else {
                                alert(data.error || 'خطا در حذف اعلان');
                            }
                        } catch (err) {
                            alert('خطا در حذف اعلان');
                        }
                    };
                    li.appendChild(deleteBtn);
                    notificationsList.appendChild(li);
                });
            } catch (error) {
                console.error('Error loading notifications:', error);
            }
        }

        // Handle user form submission
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/editor/create-user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('کاربر با موفقیت ایجاد شد');
                    document.getElementById('userForm').reset();
                    loadUsers();
                } else {
                    alert(data.error || 'خطا در ایجاد کاربر');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('خطا در ایجاد کاربر');
            }
        });

        // Handle notification form submission
        document.getElementById('notificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('notificationTitle').value;
            const message = document.getElementById('notificationMessage').value;
            const successMsg = document.getElementById('notificationSuccess');
            const errorMsg = document.getElementById('notificationError');

            // Hide previous messages
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/editor/send-notification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ title, message })
                });

                const data = await response.json();

                if (response.ok) {
                    successMsg.textContent = data.message;
                    successMsg.style.display = 'block';
                    document.getElementById('notificationForm').reset();
                    loadNotifications();

                    // Hide success message after 3 seconds
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 3000);
                } else {
                    errorMsg.textContent = data.error || 'خطا در ارسال اعلان';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMsg.textContent = 'خطا در ارسال اعلان';
                errorMsg.style.display = 'block';
            }
        });

        // On page load, check admin auth
        (async () => {
            const isAuthed = await checkAdminAuth();
            if (isAuthed) {
                showAdminPanel();
                loadUsers();
            } else {
                showLoginPanel();
            }
        })();
    </script>
</body>
</html>
