<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم - AmlakOne</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="سیستم جامع مدیریت املاک و محصولات">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AmlakOne">
    <meta name="msapplication-TileColor" content="#2563eb">
    <meta name="msapplication-config" content="/browserconfig.xml">

    <!-- PWA Icons -->
    <link rel="icon" type="image/jpeg" href="./AmlakOne-logo.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="./AmlakOne-logo.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icons/icon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/icon-180x180.png">
    <link rel="mask-icon" href="/images/icons/safari-pinned-tab.svg" color="#2563eb">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/common.js"></script>
    <script src="/js/pwa.js"></script>
    <script>
        // چک خودکار احراز هویت
        async function checkAutoLogin() {
            try {
                const response = await fetch('/api/panel/user-info', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const userData = await response.json();
                    // کاربر قبلاً لاگین کرده، هدایت به پنل
                    if (userData.username === 'admin') {
                        window.location.href = '/editor';
                    } else {
                        if (userData.profileCompleted === false) {
                            window.location.href = '/create-profile';
                        } else {
                            window.location.href = '/panel';
                        }
                    }
                }
            } catch (error) {
                // اگر خطا بود، کاربر لاگین نیست و در صفحه لاگین می‌ماند
                console.log('User not logged in');
            }
        }
        
        // اجرای چک خودکار هنگام بارگذاری صفحه
        document.addEventListener('DOMContentLoaded', checkAutoLogin);
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>خوش آمدید</h1>
                <p>برای ادامه وارد حساب کاربری خود شوید</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">نام کاربری</label>
                    <input type="text" id="username" required autocomplete="username">
                    <span class="input-highlight"></span>
                </div>

                <div class="input-group">
                    <label for="password">رمز عبور</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" fill="none"/>
                                <circle class="eye-open" cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                                <path class="eye-closed" d="m1 1 22 22M9.88 9.88a3 3 0 1 0 4.24 4.24M6.61 6.61A13.526 13.526 0 0 0 1 12a13.526 13.526 0 0 1 6.61-5.39M17.39 17.39A13.526 13.526 0 0 0 23 12a13.526 13.526 0 0 1-6.61 5.39" stroke="currentColor" stroke-width="2" fill="none" style="display: none"/>
                            </svg>
                        </button>
                    </div>
                    <span class="input-highlight"></span>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">ورود</span>
                    <div class="btn-loader"></div>
                </button>
            </form>

            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('passwordToggle').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const eyeOpen = this.querySelectorAll('.eye-open');
            const eyeClosed = this.querySelectorAll('.eye-closed');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.forEach(el => el.style.display = 'none');
                eyeClosed.forEach(el => el.style.display = 'block');
            } else {
                passwordInput.type = 'password';
                eyeOpen.forEach(el => el.style.display = 'block');
                eyeClosed.forEach(el => el.style.display = 'none');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('.login-btn');
            const btnText = submitBtn.querySelector('.btn-text');
            const loader = submitBtn.querySelector('.btn-loader');
            const errorDiv = document.getElementById('errorMessage');

            // نمایش لودر
            submitBtn.classList.add('loading');
            btnText.style.opacity = '0';
            loader.style.display = 'block';
            errorDiv.textContent = '';
            errorDiv.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // موفقیت
                    submitBtn.classList.add('success');
                    setTimeout(() => {
                        if (data.isAdmin) {
                            window.location.href = '/editor';
                        } else {
                            if (data.profileCompleted === false) {
                                window.location.href = '/create-profile';
                            } else {
                                sessionStorage.setItem('username', data.username);
                                window.location.href = '/panel';
                            }
                        }
                    }, 800);
                } else {
                    throw new Error(data.error || 'اطلاعات وارد شده صحیح نیست');
                }
            } catch (error) {
                console.error('Login Error:', error.message);
                errorDiv.textContent = error.message || 'خطا در ورود به سیستم';
                errorDiv.style.display = 'block';
                submitBtn.classList.add('error');

                setTimeout(() => {
                    submitBtn.classList.remove('error');
                }, 2000);
            } finally {
                // پنهان کردن لودر
                setTimeout(() => {
                    submitBtn.classList.remove('loading');
                    btnText.style.opacity = '1';
                    loader.style.display = 'none';
                }, 500);
            }
        });
    </script>
</body>
</html>
