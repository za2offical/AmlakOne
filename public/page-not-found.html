<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | 404</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    html, body {
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      position: fixed;
      width: 100vw;
      overscroll-behavior: none;
      touch-action: none;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f9ff 50%, #e0f2fe 100%);
      font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
      overflow: hidden;
      /* Remove extra scroll on mobile */
    }
    .notfound-container {
      background: rgba(255,255,255,0.95);
      border-radius: 2rem;
      box-shadow: 0 10px 32px 0 rgba(37,99,235,0.13);
      padding: 3rem 2.5rem 2.5rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
      animation: fadeIn 1.2s cubic-bezier(.4,0,.2,1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .notfound-svg {
      width: 220px;
      height: 180px;
      margin: 0 auto 1.5rem auto;
      display: block;
    }
    .notfound-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
      letter-spacing: -2px;
      text-shadow: 0 2px 12px #dbeafe;
    }
    .notfound-desc {
      color: var(--gray-600);
      font-size: 1.13rem;
      margin-bottom: 2.2rem;
      font-weight: 500;
    }
    .notfound-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 1rem;
      padding: 0.85rem 2.2rem;
      font-size: 1.13rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px 0 rgba(37,99,235,0.10);
      transition: background 0.22s, box-shadow 0.22s, transform 0.18s;
      text-decoration: none;
      display: inline-block;
      margin-top: 0.5rem;
    }
    .notfound-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 32px 0 rgba(37,99,235,0.16);
    }
    @media (max-width: 600px) {
      .notfound-container {
        padding: 2rem 0.5rem 1.5rem 0.5rem;
        border-radius: 1.2rem;
        animation: none !important;
      }
      .notfound-title {
        font-size: 2rem;
      }
      .notfound-svg {
        width: 150px;
        height: 120px;
      }
    }
    /* Animated background clouds */
    .cloud {
      position: absolute;
      opacity: 0.7;
      z-index: 1;
      animation: cloudMove 24s linear infinite;
    }
    .cloud1 { top: 10%; left: -120px; width: 120px; animation-delay: 0s; }
    .cloud2 { top: 30%; left: -180px; width: 180px; animation-delay: 8s; }
    .cloud3 { top: 60%; left: -90px; width: 90px; animation-delay: 16s; }
    @keyframes cloudMove {
      0% { left: -200px; }
      100% { left: 110vw; }
    }
  </style>
</head>
<body>
  <svg class="cloud cloud1" viewBox="0 0 120 60"><ellipse cx="60" cy="30" rx="60" ry="30" fill="#e0e7ff"/></svg>
  <svg class="cloud cloud2" viewBox="0 0 180 80"><ellipse cx="90" cy="40" rx="90" ry="40" fill="#dbeafe"/></svg>
  <svg class="cloud cloud3" viewBox="0 0 90 40"><ellipse cx="45" cy="20" rx="45" ry="20" fill="#bae6fd"/></svg>
  <div class="notfound-container">
    <svg class="notfound-svg" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g>
        <text x="50%" y="70%" text-anchor="middle" font-size="180" font-weight="bold" fill="#2563eb" opacity="0.13" style="font-family: Vazirmatn, Tahoma, Arial">404</text>
        <!-- Modern floating house with details -->
        <g>
          <g id="house-group">
            <!-- House shadow -->
            <ellipse cx="160" cy="132" rx="32" ry="8" fill="#c7d2fe" opacity="0.45">
              <animate attributeName="cy" values="132;122;132" dur="2.5s" repeatCount="indefinite"/>
            </ellipse>
            <!-- House base -->
            <rect x="120" y="80" width="80" height="50" rx="12" fill="#fff" stroke="#2563eb" stroke-width="3"/>
            <!-- Roof (3D effect) -->
            <polygon points="160,55 115,85 205,85" fill="#3b82f6" stroke="#2563eb" stroke-width="3"/>
            <polygon points="160,55 160,70 205,85 160,70" fill="#2563eb" opacity="0.18"/>
            <!-- Chimney -->
            <rect x="185" y="62" width="12" height="22" rx="3" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
            <!-- Chimney smoke -->
            <ellipse id="smoke1" cx="191" cy="60" rx="4" ry="7" fill="#e0e7ff" opacity="0.7">
              <animate attributeName="cy" values="60;48;60" dur="2.5s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse id="smoke2" cx="191" cy="50" rx="2.5" ry="4.5" fill="#dbeafe" opacity="0.5">
              <animate attributeName="cy" values="50;40;50" dur="2.5s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
            </ellipse>
            <!-- Door -->
            <rect x="153" y="105" width="14" height="25" rx="3" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
            <circle cx="164" cy="117" r="1.7" fill="#fff"/>
            <!-- Windows -->
            <rect x="130" y="92" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
            <rect x="176" y="92" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
            <rect x="134" y="96" width="6" height="6" rx="1.5" fill="#fff" opacity="0.7"/>
            <rect x="180" y="96" width="6" height="6" rx="1.5" fill="#fff" opacity="0.7"/>
          </g>
          <animateTransform xlink:href="#house-group" attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" keyTimes="0;0.5;1" dur="2.5s" repeatCount="indefinite"/>
        </g>
        <!-- Sun -->
        <circle cx="220" cy="40" r="18" fill="#fde047">
          <animate attributeName="r" values="18;22;18" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <!-- Birds -->
        <path d="M60 50 Q65 45 70 50" stroke="#2563eb" stroke-width="2" fill="none">
          <animate attributeName="d" values="M60 50 Q65 45 70 50;M60 52 Q65 47 70 52;M60 50 Q65 45 70 50" dur="2.5s" repeatCount="indefinite"/>
        </path>
        <path d="M80 60 Q85 55 90 60" stroke="#2563eb" stroke-width="1.5" fill="none">
          <animate attributeName="d" values="M80 60 Q85 55 90 60;M80 62 Q85 57 90 62;M80 60 Q85 55 90 60" dur="2.5s" repeatCount="indefinite"/>
        </path>
      </g>
    </svg>
    <div class="notfound-title">صفحه پیدا نشد!</div>
    <div class="notfound-desc">متاسفانه صفحه‌ای که به دنبال آن بودید پیدا نشد.<br>شاید آدرس را اشتباه وارد کرده‌اید یا این صفحه حذف شده است.</div>
    <a href="/" class="notfound-btn">بازگشت به صفحه اصلی</a>
  </div>
</body>
</html>
