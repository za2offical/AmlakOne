    <style>
        /* Enhanced Mobile Optimizations */
        @media screen and (-webkit-min-device-pixel-ratio: 0) {
            select, textarea, input[type="text"], input[type="password"], 
            input[type="datetime"], input[type="datetime-local"], 
            input[type="date"], input[type="month"], input[type="time"], 
            input[type="week"], input[type="number"], input[type="email"], 
            input[type="url"], input[type="search"], input[type="tel"], 
            input[type="color"] {
                font-size: 16px !important;
            }
        }

        /* Responsive Container */
        .container {
            width: 100%;
            max-width: 100vw;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Use CSS custom properties for dynamic viewport */
        :root {
            --vh: 1vh;
            --safe-area-inset-top: env(safe-area-inset-top);
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
            --safe-area-inset-left: env(safe-area-inset-left);
            --safe-area-inset-right: env(safe-area-inset-right);
        }

        .mobile-menu {
            height: calc(var(--vh, 1vh) * 100);
            padding-top: var(--safe-area-inset-top);
        }

        /* Enhanced touch targets */
        .touch-device button,
        .touch-device a,
        .touch-device [role="button"] {
            min-height: 44px;
            min-width: 44px;
        }

        /* Keyboard navigation styles */
        .keyboard-navigation *:focus {
            outline: 2px solid var(--primary) !important;
            outline-offset: 2px !important;
        }

        /* Responsive text scaling */
        @media (max-width: 320px) {
            html {
                font-size: 14px;
            }
        }

        @media (min-width: 1400px) {
            html {
                font-size: 18px;
            }
        }

        /* Prevent horizontal scroll */
        body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        /* Enhanced loading animation */
        @keyframes responsiveSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading svg {
            animation: responsiveSpin 1s linear infinite;
        }

        /* Responsive image optimization */
        img {
            max-width: 100%;
            height: auto;
        }

        /* Enhanced focus management */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    <script src="/js/common.js"></script>
</head>

                    <div class="stat-label">املاک فروش</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon upcoming">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <div class="stat-number" id="rentProperties">0</div>
                    <div class="stat-label">املاک اجاره</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon completed">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <div class="stat-number" id="activeProperties">0</div>
                    <div class="stat-label">املاک فعال</div>
                </div>
            </div>
        </div>

        <!-- Filters and Search -->
        <div class="filters-section center-filters" id="filtersSection" style="display: none;">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">همه</button>
                <button class="filter-btn" data-filter="sale">فروش</button>
                <button class="filter-btn" data-filter="rent">اجاره</button>
                <button class="filter-btn" data-filter="recent">جدیدترین</button>
            </div>
        </div>

        <!-- Main Panel -->
        <main id="userPanel">
            <div id="loading" class="loading" style="display: none;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" style="animation: spin 1s linear infinite; margin-bottom: 1rem;">
                    <path d="M12,4V2A10,10 0 0,0 2,12H4A8,8 0 0,1 12,4Z"/>
                </svg>
                <div>در حال بارگذاری املاک شما...</div>
            </div>

            <div id="error" class="error-message" style="display: none;"></div>

            <div id="products" class="product-container"></div>
        </main>

        <!-- Floating Action Buttons -->
        <button id="createButton" onclick="window.location.href='/create-product'" title="افزودن ملک جدید">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
        </button>

        <button id="bulkDeleteBtn" class="bulk-delete-btn" style="display: none;" onclick="window.productEditor && window.productEditor.deleteSelectedProducts()" title="حذف املاک انتخاب شده">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </button>
    </div>

    <!-- Scripts -->
    <script src="/js/edit-products.js"></script>
    <script src="/js/panel.js"></script>
    <script>
        // Enhanced Notification System
        let notifications = [];
        let unreadCount = 0;

        async function loadNotifications() {
            try {
                const response = await fetch('/api/panel/notifications', { credentials: 'include' });
                if (response.ok) {
                    notifications = await response.json();
                    updateNotificationBadge();
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
            }
        }

        async function updateNotificationBadge() {
            try {
                const response = await fetch('/api/panel/notifications/unread-count', { credentials: 'include' });
                if (response.ok) {
                    const data = await response.json();
                    unreadCount = data.unreadCount;
                    const badge = document.getElementById('notificationBadge');
                    if (unreadCount > 0) {
                        badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                        badge.style.display = 'flex';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('Error updating notification badge:', error);
            }
        }

        function openNotifications() {
            const modal = document.getElementById('notificationModal');
            const list = document.getElementById('notificationList');

            if (notifications.length === 0) {
                list.innerHTML = `
                    <div class="empty-notifications">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                        </svg>
                        <div style="font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem;">هیچ اعلانی وجود ندارد</div>
                        <div style="font-size: 0.875rem; opacity: 0.7;">تمام اعلان‌های شما در اینجا نمایش داده می‌شود</div>
                    </div>
                `;
            } else {
                list.innerHTML = notifications.map(notification => `
                    <div class="notification-item ${!notification.isRead ? 'unread' : ''}" onclick="markAsRead('${notification.id}')">
                        <div class="notification-item-title">${notification.title}</div>
                        <div class="notification-item-message">${notification.message}</div>
                        <div class="notification-item-meta">
                            <span class="notification-item-date">${new Date(notification.sentAt).toLocaleString('fa-IR')}</span>
                            ${!notification.isRead ? '<span style="color: var(--primary-500); font-size: 0.8rem; font-weight: 600;">جدید</span>' : ''}
                        </div>
                    </div>
                `).join('');
            }

            modal.style.display = 'flex';
            // Add smooth animation
            requestAnimationFrame(() => {
                modal.style.opacity = '1';
            });
        }

        function closeNotifications() {
            const modal = document.getElementById('notificationModal');
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        async function markAsRead(notificationId) {
            try {
                const response = await fetch(`/api/panel/notifications/${notificationId}/read`, {
                    method: 'POST',
                    credentials: 'include'
                });

                if (response.ok) {
                    const notification = notifications.find(n => n.id === notificationId);
                    if (notification && !notification.isRead) {
                        notification.isRead = true;
                        updateNotificationBadge();
                        openNotifications(); // Refresh the list
                    }
                }
            } catch (error) {
                console.error('Error marking notification as read:', error);
            }
        }

        // Enhanced modal interactions
        document.getElementById('notificationModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeNotifications();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeNotifications();
            }
        });

        // Enhanced loading animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }

            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .product-card {
                animation: fadeInUp 0.6s ease forwards;
            }

            .product-card:nth-child(even) {
                animation-delay: 0.1s;
            }

            .product-card:nth-child(3n) {
                animation-delay: 0.2s;
            }
        `;
        document.head.appendChild(style);

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadNotifications();
            // Refresh notifications every 30 seconds
            setInterval(loadNotifications, 30000);

            // Add smooth scroll behavior
            document.documentElement.style.scrollBehavior = 'smooth';
        });

        // Enhanced error handling with retry functionality
        window.addEventListener('online', () => {
            const errorDiv = document.getElementById('error');
            if (errorDiv.style.display !== 'none') {
                errorDiv.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color: var(--success-500);">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        اتصال برقرار شد. در حال بارگذاری مجدد...
                    </div>
                `;
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                    if (typeof loadProducts === 'function') {
                        loadProducts();
                    }
                }, 2000);
            }
        });
    </script>
</body>
</html>
