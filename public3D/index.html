<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D House Viewer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
        }

        #project-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 1001;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            z-index: 1002;
            max-width: 400px;
        }

        .back-link {
            color: #3498db;
            text-decoration: none;
            margin-top: 10px;
            display: inline-block;
        }

        .back-link:hover {
            color: #2980b9;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">
            <div class="spinner"></div>
            <div>Loading 3D House Model...</div>
        </div>

        <div id="error-message" style="display: none;">
            <h3>Error Loading Project</h3>
            <p id="error-text"></p>
            <a href="/" class="back-link">← Back to Projects List</a>
        </div>

        <div id="ui-overlay" style="display: none;">
            <div id="project-info">
                <strong>Project:</strong> <span id="project-name">Loading...</span><br>
                <strong>ID:</strong> <span id="project-id">Loading...</span><br>
                <strong>File:</strong> <span id="project-file">Loading...</span>
            </div>
            <div id="stats">
                <div>Walls: <span id="wall-count">0</span></div>
                <div>Doors: <span id="door-count">0</span></div>
                <div>Windows: <span id="window-count">0</span></div>
                <div>Rooms: <span id="room-count">0</span></div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js",
            "three/examples/jsm/loaders/GLTFLoader": "https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader';
        import { WallReader } from './js/read.js';
        import { House3D } from './js/house.js';

        class DynamicHouseViewer {
            constructor() {
                this.container = document.getElementById('container');
                this.loadingEl = document.getElementById('loading');
                this.errorEl = document.getElementById('error-message');
                this.uiOverlay = document.getElementById('ui-overlay');

                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.controls = null;
                this.house3D = null;

                this.projectInfo = null;

                this.init();
            }

            async init() {
                try {
                    // Get project info from URL
                    const urlPath = window.location.pathname;
                    const pathParts = urlPath.split('/').filter(part => part);

                    if (pathParts.length !== 2) {
                        throw new Error('Invalid URL format. Expected: /name/id');
                    }

                    const [name, id] = pathParts;

                    // Load project data
                    const projectData = await this.loadProjectData(name, id);

                    if (!projectData) {
                        throw new Error('Failed to load project data');
                    }

                    this.projectInfo = projectData.projectInfo;

                    // Update UI with project info
                    this.updateProjectInfo();

                    // Initialize 3D scene
                    this.initThreeJS();

                    // Process and render the house
                    await this.renderHouse(projectData.data);

                    // Hide loading, show UI
                    this.loadingEl.style.display = 'none';
                    this.uiOverlay.style.display = 'block';

                    console.log('✅ 3D House Viewer initialized successfully');

                } catch (error) {
                    console.error('❌ Error initializing viewer:', error);
                    this.showError('Failed to load project: ' + error.message);
                }
            }

            async loadProjectData(name, id) {
                try {
                    const response = await fetch(`/api/project/${name}/${id}`);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const result = await response.json();

                    if (!result.success) {
                        throw new Error(result.message || 'Unknown error');
                    }

                    return result;
                } catch (error) {
                    console.error('Error loading project data:', error);
                    return null;
                }
            }

            initThreeJS() {
                // Scene setup
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0xf0f0f0);

                // Camera setup
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.camera.position.set(10, 8, 10);

                // Renderer setup
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.container.appendChild(this.renderer.domElement);

                // Controls
                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;

                // Lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 10, 5);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                this.scene.add(directionalLight);

                // Handle window resize
                window.addEventListener('resize', () => this.onWindowResize());

                // Start render loop
                this.animate();
            }

            async renderHouse(jsonData) {
                // Initialize wall reader and process data
                const wallReader = new WallReader();
                const processedData = wallReader.processCustomData(jsonData);

                if (!processedData) {
                    throw new Error('Failed to process house data');
                }

                // Initialize house 3D with processed data
                this.house3D = new House3D(this.scene);
                await this.house3D.initialize();

                // Render all components
                this.house3D.renderWalls(processedData.walls);
                this.house3D.renderDoors(processedData.doors);
                this.house3D.renderWindows(processedData.windows);
                this.house3D.renderFloors(processedData.floorMeshes);

                // Update stats
                this.updateStats(processedData);

                console.log('🏠 House rendered successfully');
            }

            updateProjectInfo() {
                if (this.projectInfo) {
                    document.getElementById('project-name').textContent = this.projectInfo.name;
                    document.getElementById('project-id').textContent = this.projectInfo.id;
                    document.getElementById('project-file').textContent = this.projectInfo.filename;
                    document.title = `3D House Viewer - ${this.projectInfo.name}/${this.projectInfo.id}`;
                }
            }

            updateStats(data) {
                document.getElementById('wall-count').textContent = data.walls?.length || 0;
                document.getElementById('door-count').textContent = data.doors?.length || 0;
                document.getElementById('window-count').textContent = data.windows?.length || 0;
                document.getElementById('room-count').textContent = data.rooms?.length || 0;
            }

            showError(message) {
                this.loadingEl.style.display = 'none';
                this.uiOverlay.style.display = 'none';
                this.errorEl.style.display = 'block';
                document.getElementById('error-text').textContent = message;
            }

            onWindowResize() {
                if (this.camera && this.renderer) {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                if (this.controls) {
                    this.controls.update();
                }

                if (this.renderer && this.scene && this.camera) {
                    this.renderer.render(this.scene, this.camera);
                }
            }
        }

        // Initialize the viewer when page loads
        new DynamicHouseViewer();
    </script>
</body>
</html>
